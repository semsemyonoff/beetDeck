# Production deployment for beetDeck — the single published image
# (semsemyonoff/beetdeck) that bundles the Flask API and the pre-built SPA.
#
# This is the RUNTIME stack operators use to self-host. It pulls a tagged image
# from the registry; it does NOT build anything (see the Makefile `release`
# target for building/publishing from the pinned submodules).
#
# Quick start:
#   cp .env.example .env   # then edit paths / port / tag
#   docker compose up -d
#   open http://localhost:${BEETDECK_HTTP_PORT}

services:
  beetdeck:
    image: "${BEETDECK_IMAGE:-semsemyonoff/beetdeck}:${BEETDECK_TAG:-latest}"
    container_name: beetdeck
    restart: unless-stopped
    ports:
      - "${BEETDECK_HTTP_PORT:-8080}:5000"
    environment:
      # beets config dir read by the `beet` CLI (rescan subprocess). Mounted below.
      BEETSDIR: /config
      # SQLite library DB — read by the app and the CLI (see beetdeck/__init__.py).
      BEETS_LIBRARY_DB: /data/beets/library.db
      # Music / import dir the app scans.
      BEETS_IMPORT_DIR: /music
      # Permanent mirror for the cover-art gallery. EMPTY = off, and everything
      # the gallery downloads goes to a size- and TTL-bounded cache under the
      # container's temp dir instead — correct, just re-fetched after a restart.
      # Set BEETDECK_ARTWORK_DIR=/data/artwork in .env to keep it in the volume
      # mounted below; nothing else changes.
      BEETS_ARTWORK_STORAGE_DIR: "${BEETDECK_ARTWORK_DIR:-}"
      TZ: "${TZ:-UTC}"
    volumes:
      # beets config (config.yaml) — provide your own; see README.
      - "${BEETDECK_CONFIG_DIR:-./config}:/config"
      # Music library / import dir (your audio files).
      - "${BEETDECK_MUSIC_DIR:-./music}:/music"
      # Persistent app state — the beets SQLite DB lives here.
      - beetdeck_data:/data/beets
      # Cover-art mirror. Always mounted, written only when BEETDECK_ARTWORK_DIR
      # is set above — an unused named volume costs nothing, and mounting it
      # unconditionally means turning the mirror on is one line in .env.
      - beetdeck_artwork:/data/artwork
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/').status < 500 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---- MCP server (optional) ----
  # Exposes the library to an AI agent over MCP (streamable-http). Same image,
  # different command: a SEPARATE process that reaches the API above over HTTP.
  # It shares no memory, no config dir and no library mount with it — the REST
  # API is the only coupling.
  #
  # Opt-in via a compose profile, so a plain `docker compose up -d` is unchanged:
  #   docker compose --profile mcp up -d
  # See README → MCP server for the required .env values.
  beetdeck-mcp:
    image: "${BEETDECK_IMAGE:-semsemyonoff/beetdeck}:${BEETDECK_TAG:-latest}"
    container_name: beetdeck-mcp
    profiles: [mcp]
    restart: unless-stopped
    command: ["python", "-m", "beetdeck_mcp"]
    ports:
      - "${BEETDECK_MCP_PORT:-5100}:5100"
    environment:
      # The API service above, over the compose network (container port).
      BEETDECK_API_URL: "http://beetdeck:5000"
      # In-container bind only; the published port is the mapping above.
      BEETDECK_MCP_HOST: "0.0.0.0"
      BEETDECK_MCP_PORT: "5100"
      # Both are startup-fatal when empty, and neither degrades to a default: an
      # empty token table would publish an unauthenticated write surface, and
      # MusicBrainz rejects anonymous clients. The server itself refuses to boot
      # (exit 2, naming the variable) — deliberately NOT compose's `${VAR:?}`,
      # which is interpolated even when this profile is inactive and would break
      # a plain `docker compose up -d` for everyone not using MCP.
      BEETDECK_MCP_TOKEN: "${BEETDECK_MCP_TOKEN:-}"
      MUSICBRAINZ_USER_AGENT: "${MUSICBRAINZ_USER_AGENT:-}"
      # DNS-rebinding protection. An EMPTY value disables the Host/Origin check
      # entirely — it does NOT narrow to localhost. Set it to the hostname(s) you
      # publish this on; the bearer token is otherwise the only gate.
      BEETDECK_MCP_ALLOWED_HOSTS: "${BEETDECK_MCP_ALLOWED_HOSTS:-}"
      # Disables the apply step only. Previews still run — and they do fetch
      # remote data and can start background jobs on the API.
      BEETDECK_MCP_READONLY: "${BEETDECK_MCP_READONLY:-false}"
      TZ: "${TZ:-UTC}"
    depends_on:
      beetdeck:
        condition: service_healthy
    healthcheck:
      # /health is the one route left outside the bearer-token middleware.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5100/health').status < 500 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  beetdeck_data:
  beetdeck_artwork:
